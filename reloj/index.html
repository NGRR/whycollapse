<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111317"><title>Reloj de discusión</title><style>*{box-sizing:border-box}body{margin:0;background:#111317;color:#f5f5f5;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#191c22;border:1px solid #30343d;border-radius:18px;padding:20px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow,.muted{color:#9da6b3}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.12em}.time{font-size:clamp(72px,18vw,150px);font-weight:780;line-height:.9;letter-spacing:-.06em;text-align:center;font-variant-numeric:tabular-nums;margin:28px 0 12px}.sub{text-align:center;color:#aeb6c2}.bar{height:9px;background:#0c0e11;border-radius:9px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#76e6b5;transition:width .25s}.buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button,input{font:inherit}button{border:1px solid #3a404b;background:#242933;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.primary{background:#f3f4f6;color:#111;border-color:#f3f4f6;font-weight:700}.flag{border-color:#d7a729;color:#ffe18d}.danger{border-color:#78303d;color:#ffc2cb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 90px 38px;gap:8px;align-items:center}.row.active{outline:2px solid #76e6b5;border-radius:10px;padding:4px}input{width:100%;border:1px solid #343a45;background:#101318;color:#fff;padding:9px;border-radius:9px}.mini{padding:8px}.log{max-height:260px;overflow:auto;display:grid;gap:6px}.event{background:#101318;border-left:3px solid #667085;padding:8px 10px;border-radius:8px;font-size:14px}.event.flag{border-left-color:#d7a729}.event.change{border-left-color:#76e6b5}.event.end{border-left-color:#fb7185}.status{font-size:13px;color:#9da6b3}.warn{color:#ffe18d}@media(max-width:720px){.grid{grid-template-columns:1fr}.time{font-size:88px}}</style></head><body><main class="wrap"><section class="card"><div class="head"><div><div class="eyebrow">Reloj de moderación</div><strong id="section">Sección 1</strong></div><div id="status" class="status">Preparado</div></div><div id="time" class="time">12:00</div><div id="total" class="sub">Total restante 60:00 · bloque 1 de 4</div><div class="bar"><div id="fill" class="fill"></div></div><div class="buttons"><button id="start" class="primary">Iniciar</button><button id="pause">Pausar</button><button id="next">Siguiente</button><button id="flag" class="flag">Bandera</button><button id="p1">+1 min</button><button id="p5">+5 min</button><button id="reset" class="danger">Reiniciar</button></div></section><div class="grid"><section class="card"><div class="head"><strong>Bloques</strong><button id="add" class="mini">+ plazo</button></div><div id="rows" class="rows" style="margin-top:12px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><label class="muted">Bandera cada <input id="every" type="number" min="0" value="4"> min</label><label class="muted">Avisar faltando <input id="warn" type="number" min="0" value="1"> min</label></div><button id="apply" style="margin-top:10px;width:100%">Aplicar cambios</button></section><section class="card"><strong>Registro</strong><div id="log" class="log" style="margin-top:12px"></div></section></div></main><script>(()=>{const q=s=>document.querySelector(s),blocks0=[['Sección 1',12],['Sección 2',24],['Sección 3',20],['Cierre',4]];let blocks=blocks0.map(x=>({name:x[0],min:x[1]})),i=0,rem=720,startSec=720,elapsed=0,running=false,timer=null,lastFlag=0,warned=false;const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`,escape=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function total(){return rem+blocks.slice(i+1).reduce((a,b)=>a+b.min*60,0)}function rows(){q('#rows').innerHTML=blocks.map((b,n)=>`<div class="row ${n===i?'active':''}"><input data-name="${n}" value="${escape(b.name)}"><input data-min="${n}" type="number" min=".1" step=".5" value="${b.min}"><button data-del="${n}" class="mini">×</button></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(blocks.length<2)return;blocks.splice(+b.dataset.del,1);if(i>=blocks.length)i=blocks.length-1;load(false)})}function paint(){q('#section').textContent=blocks[i].name;q('#time').textContent=fmt(rem);q('#total').textContent=`Total restante ${fmt(total())} · bloque ${i+1} de ${blocks.length}`;q('#fill').style.width=`${Math.min(100,Math.max(0,(1-rem/startSec)*100))}%`;rows()}function evt(type,text){q('#log').insertAdjacentHTML('afterbegin',`<div class="event ${type}">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${escape(text)}</div>`)}function load(log=true){rem=Math.round(blocks[i].min*60);startSec=rem;elapsed=0;lastFlag=0;warned=false;if(log)evt('change',`Inicio de ${blocks[i].name}`);paint()}function next(){evt('end',`Fin de ${blocks[i].name}`);if(i<blocks.length-1){i++;load(true)}else{running=false;clearInterval(timer);q('#status').textContent='Agenda completada';rem=0;paint()}}function tick(){if(!running)return;rem--;elapsed++;const e=(+q('#every').value||0)*60;if(e&&elapsed%e===0&&elapsed!==lastFlag){lastFlag=elapsed;evt('flag',`Bandera automática · ${blocks[i].name}`)}const w=(+q('#warn').value||0)*60;if(!warned&&w&&rem===w){warned=true;q('#status').textContent=`Queda ${q('#warn').value} min`;q('#status').classList.add('warn');evt('flag',`Aviso final · ${fmt(rem)} restantes`)}if(rem<=0)next();paint()}q('#start').onclick=()=>{if(running)return;running=true;q('#status').textContent='En curso';q('#status').classList.remove('warn');clearInterval(timer);timer=setInterval(tick,1000);evt('change','Reloj iniciado')};q('#pause').onclick=()=>{running=false;q('#status').textContent='Pausado';evt('change','Reloj pausado')};q('#next').onclick=next;q('#flag').onclick=()=>evt('flag',`Bandera manual · ${fmt(elapsed)} transcurridos · ${fmt(rem)} restantes`);q('#p1').onclick=()=>{rem+=60;startSec+=60;evt('change','+1 minuto');paint()};q('#p5').onclick=()=>{rem+=300;startSec+=300;evt('change','+5 minutos');paint()};q('#reset').onclick=()=>{running=false;clearInterval(timer);blocks=blocks0.map(x=>({name:x[0],min:x[1]}));i=0;q('#log').innerHTML='';q('#status').textContent='Preparado';q('#status').classList.remove('warn');load(false)};q('#add').onclick=()=>{blocks.push({name:`Bloque ${blocks.length+1}`,min:5});rows()};q('#apply').onclick=()=>{document.querySelectorAll('[data-name]').forEach(x=>blocks[+x.dataset.name].name=x.value||`Bloque ${+x.dataset.name+1}`);document.querySelectorAll('[data-min]').forEach(x=>blocks[+x.dataset.min].min=Math.max(.1,+x.value||1));load(false);evt('change','Cambios aplicados')};load(false)})()</script></body></html>
